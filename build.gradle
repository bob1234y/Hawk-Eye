plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// FLAT LAYOUT: all .java files and the mod json files sit in the top folder of the repo,
// so there is no src/main/java folder to upload.
sourceSets {
	main {
		java {
			srcDirs = ['.']
			include '*.java'
		}
		resources {
			srcDirs = ['.']
			include 'fabric.mod.json'
			include 'hawkeye.mixins.json'
		}
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
	// the language file has to end up at assets/hawkeye/lang/en_us.json inside the jar
	from('en_us.json') {
		into 'assets/hawkeye/lang'
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
